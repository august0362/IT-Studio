[package]
name = "itstudio-desktop"
version = "0.1.0"
description = "IT Studio desktop shell"
edition = "2021"

[lib]
name = "itstudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

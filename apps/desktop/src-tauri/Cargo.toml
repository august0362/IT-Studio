[package]
name = "itstudio-desktop"
version = "0.1.0"
description = "IT Studio desktop shell"
edition = "2021"

[lib]
name = "itstudio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2.10.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
